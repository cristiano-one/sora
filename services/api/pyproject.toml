[project]
name = "sora-api"
version = "0.1.0"
description = "Sora Studio — API FastAPI multi-tenant com arquitetura Zero-Leak (RLS + RBAC)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "pyjwt>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "cryptography>=43,<45",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "bandit>=1.7,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "httpx>=0.28,<1",
    "testcontainers[postgres]>=4.15,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa chamadas de função em defaults (Depends/Query/...); são imutáveis.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "security: testes de segurança Zero-Leak (RLS, RBAC, anti-prompt injection)",
    "integration: testes de integração com PostgreSQL real (testcontainers)",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
